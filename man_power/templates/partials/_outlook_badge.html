{% with o=f.outlook %}{% if o == "ok" %}<span class="outlook outlook-ok" title="{{ f.projection_summary }}"><i class="bi bi-check-circle"></i> OK to {{ f.projection_end_label }}</span>{% elif o == "short_future" %}<span class="outlook outlook-warn" title="{{ f.projection_summary }}"><i class="bi bi-exclamation-triangle"></i> Short from {{ f.shortfall_label }}</span>{% elif o == "short_now" %}<span class="outlook outlook-bad" title="{{ f.projection_summary }}"><i class="bi bi-x-circle"></i> Short now{% if f.projected_horizon_status != "LESS" %}, recovers{% endif %}</span>{% else %}<span class="text-muted small">No growth</span>{% endif %}{% endwith %}
